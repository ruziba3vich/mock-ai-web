# Stage 1 of the domain move. Install this BEFORE running certbot.
#
# The final config cannot be installed first: its HTTPS blocks point at
# certificates that do not exist yet, so `nginx -t` fails and the reload is
# refused -- which in turn leaves no server block matching the new names, so
# certbot has nothing to attach its challenge to.
#
# This config is valid with only the existing certificate. It adds the new
# names on port 80 and serves the ACME challenge from the webroot instead of
# redirecting it, which is what lets the certificate be issued.

server {
    listen 80;
    listen [::]:80;
    server_name mock-ai.uz www.mock-ai.uz panel.mock-ai.uz mock.web.chessinsight.uz mockai.admin.chessinsight.uz;

    # Must come before the redirect: a 301 would send the challenge to HTTPS,
    # where there is no certificate yet.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The live site, unchanged, on the certificate it already has.
server {
    server_name mock.web.chessinsight.uz mockai.admin.chessinsight.uz;

    client_max_body_size 20m;

    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/mock.web.chessinsight.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mock.web.chessinsight.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
