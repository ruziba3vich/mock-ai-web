name: Web CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-production
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/mock-ai-web

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mockai_e2e
          POSTGRES_PASSWORD: e2e-only-password
          POSTGRES_DB: mock_ai_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mockai_e2e -d mock_ai_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test student journeys
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Check out backend for end-to-end tests
        uses: actions/checkout@v5
        with:
          repository: ruziba3vich/mock-ai
          path: .e2e/backend
          ssh-key: ${{ secrets.MOCK_AI_BACKEND_DEPLOY_KEY }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: .e2e/backend/apps/api/go.mod
          cache-dependency-path: .e2e/backend/apps/api/go.sum
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test real student journey
        env:
          DATABASE_URL: postgres://mockai_e2e:e2e-only-password@127.0.0.1:5432/mock_ai_e2e?sslmode=disable
          SESSION_SECRET: e2e-session-secret-with-more-than-32-characters
          WEB_ORIGIN: http://127.0.0.1:5173
          HTTP_ADDR: 127.0.0.1:8080
        run: |
          cd .e2e/backend/apps/api
          go run ./cmd/migrate
          go run ./cmd/api > "$RUNNER_TEMP/mock-ai-e2e-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          cd "$GITHUB_WORKSPACE"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              sed -n '1,200p' "$RUNNER_TEMP/mock-ai-e2e-api.log"
              exit 1
            fi
            sleep 1
          done
          npm run test:e2e
      - name: Upload end-to-end failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ${{ env.IMAGE_REPOSITORY }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment: production
    steps:
      - uses: actions/checkout@v5
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/mock-ai
          chmod 600 ~/.ssh/mock-ai
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/mock-ai "$VPS_USER@$VPS_HOST" 'mkdir -p ~/tools/mock-ai/frontend'
          rsync -az -e 'ssh -i ~/.ssh/mock-ai' deploy/vps/ "$VPS_USER@$VPS_HOST:tools/mock-ai/frontend/"
          ssh -i ~/.ssh/mock-ai "$VPS_USER@$VPS_HOST" 'chmod 700 ~/tools/mock-ai/frontend/deploy.sh'
      - name: Log VPS in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/mock-ai "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
      - name: Deploy and verify
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/mock-ai "$VPS_USER@$VPS_HOST" \
            "IMAGE_REPOSITORY='$IMAGE_REPOSITORY' IMAGE_TAG='sha-$GITHUB_SHA' ~/tools/mock-ai/frontend/deploy.sh"
